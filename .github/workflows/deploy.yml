
name: Hostinger CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-vps:
    name: Deploy to Hostinger VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

        with:
          host: ${{ secrets.HOST || secrets.HOSTINGER_HOST }}
          username: ${{ secrets.USERNAME || secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          timeout: 15m
          command_timeout: 15m
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY

          script: |
            set -eu

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            TARGET_DIR="${{ secrets.HOSTINGER_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/var/www/colorpellet/thecolorpalette"
            fi

            echo "Deployment directory: $TARGET_DIR"

            # Validate the project directory.
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "ERROR: Git repository not found: $TARGET_DIR"
              exit 1
            fi

            if [ ! -f "$TARGET_DIR/package.json" ] ||
               [ ! -f "$TARGET_DIR/package-lock.json" ]; then
              echo "ERROR: Project package files are missing."
              exit 1
            fi

            cd "$TARGET_DIR"

            node --version
            npm --version

            # Fetch the latest code without saving credentials in Git config.
            AUTH_HEADER="$(printf 'x-access-token:%s' \
              "$GITHUB_TOKEN" | base64 | tr -d '\n')"

            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
              fetch origin main

            unset AUTH_HEADER

            # Deploy the committed main branch.
            git reset --hard origin/main

            # Protect the production environment file from accidental
            # removal if it is untracked or ignored.
            if [ ! -f .env ]; then
              echo "ERROR: Production .env file is missing."
              exit 1
            fi

            # Install dependencies and build the production application.
            npm ci
            NEXT_TELEMETRY_DISABLED=1 npm run build

            if [ ! -d .next ]; then
              echo "ERROR: Next.js build directory is missing."
              exit 1
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: PM2 is not installed or not in PATH."
              exit 1
            fi

            # Manage only the intended application.
            if pm2 describe colorpalette >/dev/null 2>&1; then
              pm2 restart colorpalette --update-env
            else
              pm2 start npm \
                --name colorpalette \
                --cwd "$TARGET_DIR" \
                -- start -- --hostname 127.0.0.1 --port 3015
            fi

            # Wait briefly for the application to become ready.
            READY=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3015/ \
                -o /dev/null; then
                READY=1
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "ERROR: Application failed its local health check."
              pm2 logs colorpalette --lines 50 --nostream || true
              exit 1
            fi

            pm2 save
            pm2 status

            echo "Deployment completed and local health check passed."
